image: node:18-alpine

options:
  size: 2x

definitions:
  caches:
    node: ~/.npm

  steps:
    - step: &build_test
        name: Build, Test & Collect Metrics
        caches:
          - node
        script:
          - apk add --no-cache libc6-compat jq
          - npm ci
          - npm test -- --coverage || echo "No tests configured"
          - npm run build

          # Extract coverage percentage if present
          - |
            if [ -f coverage/coverage-summary.json ]; then
              export UNIT_TEST_COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            else
              export UNIT_TEST_COVERAGE=0
            fi

        artifacts:
          - coverage/**
          - .next/**

    - step: &report_to_compass
        name: Report Metrics to Compass
        script:
          - pipe: atlassian/compass-report:1.5.0
            variables:
              COMPASS_API_TOKEN: $COMPASS_API_TOKEN
              COMPONENT_ID: $COMPASS_COMPONENT_ID
              EVENT_TYPE: build
              DESCRIPTION: "Frontend CI metrics from Bitbucket Pipelines"
              METRICS: >
                {
                  "unit_test_coverage": {
                    "value": ${UNIT_TEST_COVERAGE},
                    "unit": "percentage"
                  },
                  "open_pull_requests": {
                    "value": ${BITBUCKET_PR_ID:-0}
                  },
                  "mean_time_to_resolve": {
                    "value": 0,
                    "unit": "hours"
                  },
                  "recent_incidents": {
                    "value": 0
                  }
                }

pipelines:
  default:
    - step: *build_test
    - step: *report_to_compass

  branches:
    feature/*:
      - step: *build_test
      - step: *report_to_compass

    dev:
      - step: *build_test
      - step: *report_to_compass

    main:
      - step: *build_test
      - step: *report_to_compass
