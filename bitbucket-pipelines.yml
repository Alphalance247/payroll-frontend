image: atlassian/default-image:3

options:
  docker: true
  size: 2x

definitions:
  services:
    docker:
      memory: 3072

  caches:
    node: ~/.npm

  steps:
    - step: &lint_dockerfile
        name: Lint Dockerfile (Hadolint)
        image: hadolint/hadolint:latest-debian
        clone: true
        script:
          - ls -la
          - hadolint ./Dockerfile

    - step: &test_and_coverage
        name: Run Tests and Generate Coverage
        image: node:18-alpine
        caches:
          - node
        script:
          - apk add --no-cache libc6-compat
          - |
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          - npm test -- --coverage || echo "No tests configured, skipping"
        artifacts:
          - coverage/**

    - step: &build_image
        name: Build Next.js Docker Image
        services:
          - docker
        script:
          - export IMAGE_NAME=${BITBUCKET_REPO_SLUG}
          - export DOCKER_BUILDKIT=1
          - docker build --file Dockerfile --tag ${IMAGE_NAME}:ci .
          - docker save ${IMAGE_NAME}:ci --output ${IMAGE_NAME}.tar
        artifacts:
          - "*.tar"

    - step: &push_image
        name: Push Docker Image (Main)
        deployment: Production
        services:
          - docker
        script:
          - echo "${DOCKERHUB_PASSWORD}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin
          - export IMAGE_NAME=${BITBUCKET_REPO_SLUG}
          - export VERSION=prod-${BITBUCKET_BUILD_NUMBER}
          - docker load --input ${IMAGE_NAME}.tar
          - docker tag ${IMAGE_NAME}:ci ${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}:${VERSION}
          - docker push ${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}:${VERSION}

pipelines:
  default:
    - parallel:
        - step: *lint_dockerfile
        - step: *test_and_coverage
    - step: *build_image

  branches:
    feature/*:
      - parallel:
          - step: *lint_dockerfile
          - step: *test_and_coverage
      - step:
          <<: *build_image
          name: Build Docker Image (Feature Branch)

    dev:
      - parallel:
          - step: *lint_dockerfile
          - step: *test_and_coverage
      - step:
          <<: *build_image
          name: Build Docker Image (Dev Branch)

    main:
      - parallel:
          - step: *lint_dockerfile
          - step: *test_and_coverage
      - step: *build_image
      - step: *push_image
