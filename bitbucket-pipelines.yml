image: node:18-alpine

options:
  docker: true
  size: 2x

definitions:
  services:
    docker:
      memory: 4096

  caches:
    docker: /var/lib/docker
    node: ~/.npm

  steps:
    - step: &docker-build
        name: Build Docker Image (Next.js)
        image: docker:24.0.7
        services:
          - docker
        caches:
          - docker
        script:
          - set -e
          - docker version
          - docker build --progress=plain -t payroll-frontend:${BITBUCKET_COMMIT} .
        artifacts:
          - docker-build.log

    - step: &docker-test
        name: Run Container & Generate Coverage
        image: docker:24.0.7
        services:
          - docker
        caches:
          - docker
        script:
          - set -e
          - docker run -d --name frontend-test -p 3000:3000 payroll-frontend:${BITBUCKET_COMMIT}
          - sleep 15
          - docker ps | grep frontend-test
          # Optional: if test/coverage script exists in image
          - |
            if docker exec frontend-test sh -c "test -f package.json && (npm run test -- --coverage || yarn test --coverage)"; then
              docker exec frontend-test sh -c "mkdir -p /app/coverage"
            else
              echo "No test/coverage script found, skipping coverage generation"
            fi
          - docker stop frontend-test
          - docker rm frontend-test
        artifacts:
          - coverage/**

    - step: &docker-build-dev
        name: Build & Tag Docker Image (dev)
        image: docker:24.0.7
        services:
          - docker
        caches:
          - docker
        script:
          - set -e
          - docker build --progress=plain -t payroll-frontend:latest -t payroll-frontend:${BITBUCKET_BUILD_NUMBER} .
        artifacts:
          - docker-build.log

pipelines:
  branches:
    dev:
      - step: *docker-build
      - step: *docker-test

    main:
      - step: *docker-build-dev
      - step: *docker-test

  pull-requests:
    '**':
      - step:
          name: PR Validation – Docker Build
          image: docker:24.0.7
          services:
            - docker
          caches:
            - docker
          script:
            - set -e
            - docker build --progress=plain -t payroll-frontend:pr-${BITBUCKET_PR_ID} .

  default:
    - step:
        name: Default Safety Build
        image: docker:24.0.7
        services:
          - docker
        caches:
          - docker
        script:
          - set -e
          - docker build --progress=plain -t payroll-frontend:default .
