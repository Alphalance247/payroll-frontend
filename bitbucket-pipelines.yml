image: node:18-alpine

# Pipeline configuration options
options:
  size: 2x  # Use 2x for resource-intensive Next.js builds
  max-time: 10

# Define caches to speed up builds
definitions:
  caches:
    node: ~/.npm
    nextcache: .next/cache

  # Reusable step definitions
  steps:
    - step: &lint
        name: Lint Code
        caches:
          - node
        script:
          - echo "Installing dependencies..."
          - npm ci
          - echo "Running ESLint..."
          - npm run lint
        after-script:
          - echo "✓ Linting completed"

    - step: &test
        name: Run Tests with Coverage
        caches:
          - node
        script:
          - echo "Installing dependencies..."
          - apk add --no-cache libc6-compat jq
          - npm ci
          # package.json currently declares no "test" script, so `npm test`
          # would exit non-zero on every run. Check for the script first and
          # say so plainly, instead of hiding a real failure behind `|| true`
          # once tests do exist.
          - |
            if jq -e '.scripts.test' package.json >/dev/null 2>&1; then
              echo "Running tests with coverage..."
              npm test -- --coverage
            else
              echo "⚠ No \"test\" script in package.json - skipping."
              echo "  Add a test runner (e.g. vitest or jest) to enable this step."
            fi

          # Extract coverage percentage
          - |
            if [ -f coverage/coverage-summary.json ]; then
              export UNIT_TEST_COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
              echo "✓ Code coverage: ${UNIT_TEST_COVERAGE}%"
            else
              echo "No coverage data generated"
              export UNIT_TEST_COVERAGE=0
            fi
        artifacts:
          - coverage/**
          - test-results/**
        after-script:
          - echo "✓ Tests completed"

    - step: &build
        name: Build Application
        caches:
          - node
          - nextcache
        script:
          - echo "Installing dependencies..."
          - apk add --no-cache libc6-compat
          - npm ci
          - echo "Building Next.js application..."
          - npm run build
          - echo "✓ Build completed successfully"
        artifacts:
          - .next/**
        after-script:
          - echo "✓ Build artifacts created"

    - step: &security-scan
        name: Security Scan
        caches:
          - node
        script:
          - echo "Installing dependencies..."
          - npm ci
          - echo "Running npm audit..."
          - npm audit --audit-level=moderate || true
          - echo "Checking for outdated packages..."
          - npm outdated || true
        after-script:
          - echo "✓ Security scan completed"

    - step: &report-to-compass
        name: Report Metrics to Compass
        script:
          - echo "Preparing to report metrics to Compass..."
          - apk add --no-cache jq curl git

          # Extract coverage percentage if available
          - |
            if [ -f coverage/coverage-summary.json ]; then
              export UNIT_TEST_COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
              echo "✓ Extracted coverage: ${UNIT_TEST_COVERAGE}%"
              echo "✓ Unit Test Coverage: ${UNIT_TEST_COVERAGE}%"
            else
              export UNIT_TEST_COVERAGE=0
              echo "⚠ No coverage data found, using 0%"
            fi
          
          # Count open pull requests for this repository
          - |
            if [ -n "$BITBUCKET_PR_ID" ]; then
              export OPEN_PULL_REQUESTS=1
              echo "✓ Running in PR context: PR #${BITBUCKET_PR_ID}"
            else
              # Query Bitbucket API for open PRs
              PR_RESPONSE=$(curl -s -X GET \
                "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/pullrequests?state=OPEN" \
                -H "Authorization: Bearer ${BITBUCKET_TOKEN:-}" \
                2>/dev/null || echo '{"size":0}')
              
              export OPEN_PULL_REQUESTS=$(echo "$PR_RESPONSE" | jq -r '.size // 0')
              echo "✓ Open Pull Requests: ${OPEN_PULL_REQUESTS}"
            fi
          
          # Calculate Mean Time To Resolve (based on recent closed PRs)
          - |
            # Query last 10 closed PRs to calculate MTTR
            CLOSED_PR_RESPONSE=$(curl -s -X GET \
              "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/pullrequests?state=MERGED&pagelen=10" \
              -H "Authorization: Bearer ${BITBUCKET_TOKEN:-}" \
              2>/dev/null || echo '{"values":[]}')
            
            # Calculate average time from PR creation to merge (in hours)
            MTTR=$(echo "$CLOSED_PR_RESPONSE" | jq -r '
              [.values[] | 
                ((.updated_on | fromdateiso8601) - (.created_on | fromdateiso8601)) / 3600
              ] | 
              if length > 0 then (add / length) else 0 end | floor
            ' 2>/dev/null || echo "0")
            
            export MEAN_TIME_TO_RESOLVE=${MTTR}
            echo "✓ Mean Time To Resolve: ${MEAN_TIME_TO_RESOLVE} hours (avg of last 10 merged PRs)"
          
          # Count recent incidents (using failed builds as proxy)
          - |
            # Query recent pipeline failures as incidents
            FAILED_BUILDS=$(curl -s -X GET \
              "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/pipelines/?pagelen=20&sort=-created_on" \
              -H "Authorization: Bearer ${BITBUCKET_TOKEN:-}" \
              2>/dev/null || echo '{"values":[]}')
            
            # Count failed pipelines in last 20 runs
            export RECENT_INCIDENTS=$(echo "$FAILED_BUILDS" | jq -r '
              [.values[] | select(.state.name == "FAILED" or .state.name == "ERROR")] | length
            ' 2>/dev/null || echo "0")
            
            echo "✓ Recent Incidents: ${RECENT_INCIDENTS} (failed builds in last 20 runs)"
          
          # Report to Compass via REST API
          - echo "Sending all metrics to Compass API..."
          - |
            # Create comprehensive metrics payload
            PAYLOAD=$(cat <<EOF
            {
              "metricSourceId": "bitbucket-pipelines-${BITBUCKET_BUILD_NUMBER}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "metrics": [
                {
                  "metricAri": "ari:cloud:compass::metric/unit-test-coverage",
                  "value": ${UNIT_TEST_COVERAGE}
                },
                {
                  "metricAri": "ari:cloud:compass::metric/open-pull-requests",
                  "value": ${OPEN_PULL_REQUESTS}
                },
                {
                  "metricAri": "ari:cloud:compass::metric/mean-time-to-resolve",
                  "value": ${MEAN_TIME_TO_RESOLVE}
                },
                {
                  "metricAri": "ari:cloud:compass::metric/recent-incidents",
                  "value": ${RECENT_INCIDENTS}
                },
                {
                  "metricAri": "ari:cloud:compass::metric/build-status",
                  "value": 1
                }
              ]
            }
            EOF
            )
            
            # Send to Compass REST API
            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.atlassian.com/compass/v1/components/${COMPASS_COMPONENT_ID}/metrics" \
              -H "Authorization: Bearer ${COMPASS_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "${PAYLOAD}")
            
            HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
            RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
            
            echo "HTTP Response Code: ${HTTP_CODE}"
            
            # Guard the comparison: a curl failure leaves HTTP_CODE non-numeric,
            # which would make `[ -ge ]` error out instead of reporting cleanly.
            case "$HTTP_CODE" in
              2??)
                echo "✅ All metrics successfully sent to Compass!"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "📈 Unit Test Coverage:    ${UNIT_TEST_COVERAGE}%"
                echo "📋 Open Pull Requests:    ${OPEN_PULL_REQUESTS}"
                echo "⏱️  Mean Time To Resolve:  ${MEAN_TIME_TO_RESOLVE} hours"
                echo "🚨 Recent Incidents:       ${RECENT_INCIDENTS}"
                echo "✓  Build Status:           Success"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                ;;
              *)
                echo "⚠️  Warning: Failed to send metrics to Compass (HTTP ${HTTP_CODE})"
                echo "Response: ${RESPONSE_BODY}"
                echo "Note: Pipeline continues despite this warning"
                ;;
            esac
        after-script:
          - echo "✓ Compass metrics reporting step completed"

    # ------------------------------------------------------------------
    # Deploy: SSH only. Slim image — nothing is built here.
    #
    # Deployment variables match six-signal / vendorpaybackend / vendorpay-frontend
    # exactly, so one deploy key and one set of names serve every repo. Used by
    # both the development and production environments via `<<: *deploy`, so each
    # supplies its own SSH_HOST / DEPLOY_PATH.
    # ------------------------------------------------------------------
    - step: &deploy
        name: Deploy over SSH
        image: alpine:3.22
        clone:
          enabled: false
        # `docker compose up --build` on the host builds the Next.js image, which
        # regularly runs past the 10-minute global default in `options`.
        max-time: 30
        script:
          # openssh-keygen is a SEPARATE Alpine package from openssh-client.
          # Without it ssh-keygen is simply "not found" and the key checks below
          # die with no explanation.
          - apk add --no-cache openssh-client openssh-keygen
          # Required deployment variables:
          #
          #   SSH_PRIVATE_KEY_B64   base64 -w0 of the ed25519 PRIVATE key (not .pub)
          #   KNOWN_HOSTS_B64       base64 -w0 of `ssh-keyscan -H <SSH_HOST>` output
          #   SSH_HOST              bare hostname or IP — no scheme, no port, no slash
          #   SSH_USER              login user on the host
          #   DEPLOY_PATH           absolute path to the checkout on the host
          #
          # SSH_PORT is OPTIONAL and defaults to 22. The reference repos carry no
          # port variable at all, so leaving it unset reproduces their behaviour.
          #
          # The development and production environments must define DISTINCT
          # SSH_HOST / DEPLOY_PATH values.
          #
          # The deploy key comes from deployment variables, NOT from Repository
          # settings -> Pipelines -> SSH keys. That key must be CLEARED: if one is
          # configured there Bitbucket also injects it at ~/.ssh/id_rsa, and the
          # two keys together are what produces "error in libcrypto".
          - |
            set -e
            mkdir -p ~/.ssh && chmod 700 ~/.ssh

            # An empty value means the variable is unset, misspelled, or out of
            # deployment scope. Check all of them up front, because each fails
            # obscurely on its own: an empty SSH_PRIVATE_KEY_B64 writes a 0-byte
            # key and reads as "Permission denied (publickey)", and an empty
            # SSH_HOST makes the command `ssh user@`.
            # Note the name is SSH_HOST, not SSH_HOSTS.
            for v in SSH_PRIVATE_KEY_B64 KNOWN_HOSTS_B64 SSH_HOST SSH_USER DEPLOY_PATH; do
              [ -n "$(printenv "$v")" ] || { echo "MISSING: $v is empty — set it on the '$BITBUCKET_DEPLOYMENT_ENVIRONMENT' deployment environment (exact spelling)."; exit 1; }
            done
            echo "OK: all five required deployment variables are present"

            export SSH_PORT="${SSH_PORT:-22}"
            case "$SSH_PORT" in
              ''|*[!0-9]*) echo "FAIL: SSH_PORT must be numeric, got '$SSH_PORT'."; exit 1 ;;
            esac
            echo "ssh port: $SSH_PORT$([ "$SSH_PORT" = 22 ] && echo ' (default)')"

            command -v ssh-keygen >/dev/null 2>&1 || { echo "FAIL: ssh-keygen not installed — add the openssh-keygen package"; exit 1; }

            # --- private key -------------------------------------------------
            # Whitespace is stripped first: a value pasted from a wrapped
            # terminal line can carry newlines or trailing spaces, which are not
            # part of the encoding.
            KEY_B64=$(printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\n\r \t')

            # Base64 always comes in groups of 4, so a count that is not a
            # multiple of 4 proves characters were lost in the paste — that is
            # what "base64: truncated input" means.
            KEY_LEN=$(printf '%s' "$KEY_B64" | wc -c)
            echo "SSH_PRIVATE_KEY_B64: $KEY_LEN base64 characters received"
            if [ $(( KEY_LEN % 4 )) -ne 0 ]; then
              echo "FAIL: $KEY_LEN is not a multiple of 4, so the pasted value is incomplete."
              echo "  Get the expected count on the server with:"
              echo "    base64 -w0 ~/.ssh/id_ed25519 | wc -c"
              echo "  (a 464-byte ed25519 key encodes to 620 characters)."
              exit 1
            fi

            printf '%s' "$KEY_B64" | base64 -d > ~/.ssh/id_ed25519 2>/tmp/b64.err || {
              echo "FAIL: SSH_PRIVATE_KEY_B64 did not decode: $(cat /tmp/b64.err)"
              echo "  Regenerate with: base64 -w0 <keyfile>   (plain base64 wraps at 76 columns)"
              exit 1
            }
            chmod 600 ~/.ssh/id_ed25519
            echo "decoded private key: $(wc -c < ~/.ssh/id_ed25519) bytes"

            # Header check, because busybox base64 is lenient and will happily
            # decode the wrong thing. Prints only the first line, never the body.
            if ! head -n 1 ~/.ssh/id_ed25519 | grep -q 'BEGIN .*PRIVATE KEY'; then
              echo "FAIL: the decoded value is not a private key. First 40 characters:"
              head -n 1 ~/.ssh/id_ed25519 | cut -c1-40
              echo "  A PRIVATE key starts '-----BEGIN OPENSSH PRIVATE KEY-----' and is ~400 bytes."
              echo "  A PUBLIC key starts 'ssh-ed25519 AAAA' — that one belongs in the"
              echo "  server's authorized_keys, not in this variable."
              exit 1
            fi

            # Derives the public half: fails on a malformed key, and on a
            # passphrase-protected key, which cannot be used unattended.
            ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/derived.pub 2>/tmp/kg.err || {
              echo "FAIL: ssh-keygen could not read the private key: $(cat /tmp/kg.err)"
              echo "  If it has a passphrase, regenerate it with an empty one."
              exit 1
            }
            echo "deploy key: $(ssh-keygen -lf /tmp/derived.pub)"
            echo "  ^ compare against: ssh-keygen -lf ~/.ssh/authorized_keys  (as $SSH_USER on $SSH_HOST)"

            # --- host key ----------------------------------------------------
            printf '%s' "$KNOWN_HOSTS_B64" | tr -d '\n\r \t' | base64 -d > ~/.ssh/known_hosts 2>/tmp/b64h.err || {
              echo "FAIL: KNOWN_HOSTS_B64 did not decode: $(cat /tmp/b64h.err)"
              echo "  Regenerate with: ssh-keyscan -H $SSH_HOST | base64 -w0"
              exit 1
            }
            chmod 644 ~/.ssh/known_hosts
            echo "known_hosts: $(wc -l < ~/.ssh/known_hosts) entries"

            # ssh-keyscan records the exact name it was given, so scanning an IP
            # and connecting by hostname (or the reverse) fails verification.
            # On a non-default port the entry is keyed "[host]:port", so the
            # lookup has to match that form too.
            if [ "$SSH_PORT" = "22" ]; then
              HOST_KEY_ID="$SSH_HOST"
              KEYSCAN_HINT="ssh-keyscan -H $SSH_HOST | base64 -w0"
            else
              HOST_KEY_ID="[$SSH_HOST]:$SSH_PORT"
              KEYSCAN_HINT="ssh-keyscan -H -p $SSH_PORT $SSH_HOST | base64 -w0"
            fi
            if ! ssh-keygen -F "$HOST_KEY_ID" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
              echo "FAIL: known_hosts decoded but has no entry for '$HOST_KEY_ID'."
              echo "  Regenerate on a TRUSTED machine, matching SSH_HOST and SSH_PORT exactly:"
              echo "    $KEYSCAN_HINT"
              exit 1
            fi
            echo "OK: host key for $HOST_KEY_ID is pinned"
          # NOTE: this repo has no Dockerfile or docker-compose.yml committed, so
          # the compose file must already exist in DEPLOY_PATH on the host (the
          # same arrangement as payroll-backend's deploy.sh). The check below says
          # so explicitly rather than failing on a bare "no configuration file".
          #
          # The host checkout follows whichever branch triggered this run, so the
          # dev server always shows the most recent push. Three details matter:
          #
          #   * `git reset --hard` first, with no argument, drops local edits to
          #     TRACKED files so the following checkout cannot fail on them. It
          #     is deliberately not `git clean`: docker-compose.yml and .env live
          #     in DEPLOY_PATH untracked, and cleaning would delete them.
          #   * `checkout -B` recreates the branch pointer at the exact commit,
          #     which also handles a branch the host has never seen before.
          #   * pinning to $BITBUCKET_COMMIT rather than origin/$BITBUCKET_BRANCH
          #     means the host lands on the commit this run actually built, even
          #     if another push arrived while the pipeline was queued.
          - >
            ssh -i ~/.ssh/id_ed25519
            -p "$SSH_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            "$SSH_USER@$SSH_HOST"
            "set -e &&
            cd '$DEPLOY_PATH' &&
            git fetch --all --prune &&
            git reset --hard &&
            git checkout -B '$BITBUCKET_BRANCH' '$BITBUCKET_COMMIT' &&
            { test -f docker-compose.yml || test -f compose.yaml; } ||
              { echo 'FAIL: no docker-compose.yml in $DEPLOY_PATH on this host.'; exit 1; } &&
            docker compose up -d --build &&
            docker compose ps &&
            docker image prune -f"

    # The dev server. Reached by a push to `dev` and by nothing else.
    #
    # Bitbucket will not run two deployments to the same environment
    # concurrently — a second push queues behind the first rather than racing it
    # on the host.
    - step: &deploy-dev
        <<: *deploy
        name: Deploy to Development environment
        deployment: development

    # The production server. Reached only by a push to `master`, which in
    # practice means Bitbucket merging a pull request.
    #
    # This environment must define its OWN SSH_HOST and DEPLOY_PATH, pointing at
    # the production host. If they are copied from the development environment a
    # merge to master will redeploy the dev box and production will never update
    # — the deploy reports success either way, because the SSH connection and the
    # compose rebuild both succeed.
    - step: &deploy-production
        <<: *deploy
        name: Deploy to Production environment
        deployment: production

# Pipeline definitions for different branches
#
# Two deploying branches, and nothing else reaches a server:
#
#   dev             -> development environment (the dev box)
#   master (main)   -> production environment
#
# A branch that matches an entry under `branches:` does NOT also run `default`,
# so each of the sections below is complete on its own. In every one of them the
# deploy runs last, so lint/test/build gate it — a red build reaches no host.
pipelines:
  # Any branch with no explicit rule below — feature branches, in practice. Note
  # the team's `feat/name/topic` branches land here rather than under a
  # 'feature/*' rule, because a Bitbucket `*` does not cross a `/`.
  #
  # Checks only, no deploy. Feature branches used to deploy to the dev box,
  # which meant whoever pushed last took it from whoever was using it; now only
  # `dev` moves that server.
  default:
    - parallel:
        - step: *lint
        - step: *test
    - step: *build
    - step: *security-scan

  # Branch-specific pipelines
  branches:
    # Development branch. A push here deploys to the dev server; a merged pull
    # request into dev is such a push, so it deploys too.
    dev:
      - parallel:
          - step: *lint
          - step: *test
      - step: *build
      - step: *security-scan
      - step: *report-to-compass
      - step: *deploy-dev

    # Production branch. This repo's production branch is `master`; `main` is
    # matched too so the rule keeps working if the branch is ever renamed.
    #
    # This pipeline runs on a push to master, and the only intended push is
    # Bitbucket merging a pull request — that merge IS the release, so the
    # deploy is no longer behind a manual trigger. It also no longer deploys to
    # development first: master touching the dev box would overwrite whatever
    # dev was testing.
    #
    # Nothing in a pipeline file can require that a push arrived via a pull
    # request; that has to be enforced on the branch. Set Repository settings ->
    # Branch restrictions on master to prevent direct pushes and require a pull
    # request, or a local `git push origin master` will release straight to
    # production.
    "{main,master}":
      - parallel:
          - step: *lint
          - step: *test
      - step: *build
      - step: *security-scan
      - step: *report-to-compass
      - step: *deploy-production

  # The pre-merge check for both flows above. A pull-request pipeline builds the
  # source branch merged into its destination, which the branch build never
  # tests. No deploy step is defined here, so a pull request never reaches a
  # server.
  pull-requests:
    '**':
      - parallel:
          - step: *lint
          - step: *test
      - step: *build
      - step: *report-to-compass