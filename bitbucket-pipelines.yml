# Bitbucket Pipelines configuration for payroll-frontend (Next.js 15)
# This pipeline runs linting, tests, build, generates coverage artifacts,
# and publishes deployment metrics to Atlassian Compass for DORA tracking.

image: node:20

options:
  size: 2x

definitions:
  caches:
    npm: ~/.npm

  steps:
    - step: &install_deps
        name: Install dependencies
        caches:
          - npm
        script:
          - npm ci

    - step: &lint
        name: Lint
        script:
          - |
            if npm run | grep -q "lint"; then
              npm run lint
            else
              echo "No lint script found, skipping lint step."
            fi

    - step: &test
        name: Test & Coverage
        script:
          - |
            if npm run | grep -q "test"; then
              npm run test -- --coverage || npm run test
            else
              echo "No test script found, skipping tests."
            fi
        artifacts:
          - coverage/**

    - step: &build
        name: Build
        script:
          - npm run build
        artifacts:
          - .next/**
          - out/**

    - step: &compass_deploy
        name: Publish deployment to Compass
        script:
          - pipe: atlassian/compass-deployment:1.4.0
            variables:
              ATLASSIAN_USER_EMAIL: $ATLASSIAN_USER_EMAIL
              ATLASSIAN_API_TOKEN: $ATLASSIAN_API_TOKEN
              CLOUD_ID: $COMPASS_CLOUD_ID
              COMPONENT_ID: "ari:cloud:compass:f8428991-f914-4927-92be-879835a51fd9:component/0e7bd41b-c4ff-471d-9cb8-21fc832290dd/9b1ca5ce-2bb4-4bb0-a2bc-bfcb2e8848a2"
              ENVIRONMENT: $DEPLOY_ENV
              DEPLOYMENT_STATUS: SUCCESS
              PIPELINE_URL: $BITBUCKET_PIPELINE_URL
              REVISION: $BITBUCKET_COMMIT
              BRANCH: $BITBUCKET_BRANCH

pipelines:
  default:
    - step: *install_deps
    - step: *lint
    - step: *test
    - step: *build
    - step:
        <<: *compass_deploy
        name: Publish development deployment to Compass
        deployment: development
        script:
          - export DEPLOY_ENV=development
          - pipe: atlassian/compass-deployment:1.4.0
            variables:
              ATLASSIAN_USER_EMAIL: $ATLASSIAN_USER_EMAIL
              ATLASSIAN_API_TOKEN: $ATLASSIAN_API_TOKEN
              CLOUD_ID: $COMPASS_CLOUD_ID
              COMPONENT_ID: "ari:cloud:compass:f8428991-f914-4927-92be-879835a51fd9:component/0e7bd41b-c4ff-471d-9cb8-21fc832290dd/9b1ca5ce-2bb4-4bb0-a2bc-bfcb2e8848a2"
              ENVIRONMENT: development
              DEPLOYMENT_STATUS: SUCCESS
              PIPELINE_URL: $BITBUCKET_PIPELINE_URL
              REVISION: $BITBUCKET_COMMIT
              BRANCH: $BITBUCKET_BRANCH

  branches:
    main:
      - step: *install_deps
      - step: *lint
      - step: *test
      - step: *build
      - step:
          <<: *compass_deploy
          name: Publish production deployment to Compass
          deployment: production
          script:
            - export DEPLOY_ENV=production
            - pipe: atlassian/compass-deployment:1.4.0
              variables:
                ATLASSIAN_USER_EMAIL: $ATLASSIAN_USER_EMAIL
                ATLASSIAN_API_TOKEN: $ATLASSIAN_API_TOKEN
                CLOUD_ID: $COMPASS_CLOUD_ID
                COMPONENT_ID: "ari:cloud:compass:f8428991-f914-4927-92be-879835a51fd9:component/0e7bd41b-c4ff-471d-9cb8-21fc832290dd/9b1ca5ce-2bb4-4bb0-a2bc-bfcb2e8848a2"
                ENVIRONMENT: production
                DEPLOYMENT_STATUS: SUCCESS
                PIPELINE_URL: $BITBUCKET_PIPELINE_URL
                REVISION: $BITBUCKET_COMMIT
                BRANCH: $BITBUCKET_BRANCH

  pull-requests:
    "**":
      - step: *install_deps
      - step: *lint
      - step: *build


