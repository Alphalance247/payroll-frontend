services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payroll-frontend
    volumes:
      - /srv/static/_next/static:/app/.next/static
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    restart: always
    networks:
      - webnet

networks:
  webnet: